<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
  <meta http-equiv="Pragma" content="no-cache" />
  <meta http-equiv="Expires" content="0" />
  <title>NEON STRIKER — シューティング＋RPG</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      background: #000;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      overflow: hidden;
      font-family: 'Courier New', Courier, monospace;
    }

    #game-wrapper {
      position: relative;
      /* JS が論理サイズをそのまま設定するので CSS では固定しない */
    }

    #game {
      display: block;
      image-rendering: pixelated;
      image-rendering: crisp-edges;
      /* 画面に収まるよう最大サイズを制限 */
      max-width: 100vw;
      max-height: 100vh;
    }

    /* ローディング表示（JS が有効になれば即消える） */
    #loading {
      position: absolute;
      inset: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      color: #0af;
      font-size: 18px;
      letter-spacing: 4px;
      pointer-events: none;
    }
  </style>
</head>
<body>
  <div id="game-wrapper">
    <canvas id="game"></canvas>
    <div id="loading">LOADING...</div>
  </div>
  <script>
    // キャッシュを完全に無効化するためタイムスタンプ付きで動的にロード
    const v = Date.now();
    const s = document.createElement('script');
    s.type = 'module';
    s.src  = `src/main.js?v=${v}`;
    document.body.appendChild(s);
  </script>
</body>
</html>
